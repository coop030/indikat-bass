name: Build INDIKAT Star Pad

on:
  push:
    branches: [starpad]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-15-intel
            name: macOS
          - os: ubuntu-24.04
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Konfigurieren
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Bauen
        run: cmake --build build --config Release --parallel 4

      # Auf dem jeweiligen System packen, damit Mac-Bundles (Symlinks, Rechte) intakt bleiben
      - name: Packen
        shell: bash
        run: |
          mkdir -p dist/INDIKAT-Star-Pad
          cp -R build/IndikatStarPad_artefacts/Release/VST3/*.vst3 dist/INDIKAT-Star-Pad/
          if [ "$RUNNER_OS" == "macOS" ]; then
            cp -R build/IndikatStarPad_artefacts/Release/AU/*.component dist/INDIKAT-Star-Pad/
            cp -R build/IndikatStarPad_artefacts/Release/Standalone/*.app dist/INDIKAT-Star-Pad/
            for p in dist/INDIKAT-Star-Pad/*; do codesign --force --deep --sign - "$p"; done
            cp "packaging/macos/INDIKAT installieren.command" dist/INDIKAT-Star-Pad/
            chmod +x "dist/INDIKAT-Star-Pad/INDIKAT installieren.command"
            (cd dist && ditto -c -k --keepParent INDIKAT-Star-Pad "INDIKAT-Star-Pad-${{ matrix.name }}.zip")
          elif [ "$RUNNER_OS" == "Windows" ]; then
            cp build/IndikatStarPad_artefacts/Release/Standalone/*.exe dist/INDIKAT-Star-Pad/
            (cd dist && 7z a -tzip "INDIKAT-Star-Pad-${{ matrix.name }}.zip" INDIKAT-Star-Pad > /dev/null)
          else
            (cd dist && zip -qry "INDIKAT-Star-Pad-${{ matrix.name }}.zip" INDIKAT-Star-Pad)
          fi

      - name: Hochladen
        uses: actions/upload-artifact@v5
        with:
          name: INDIKAT-Star-Pad-${{ matrix.name }}
          path: dist/INDIKAT-Star-Pad-${{ matrix.name }}.zip

  # Download-Seite: jedes Build-Ergebnis wird als Release veröffentlicht (auch wenn ein System fehlt)
  release:
    needs: build
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: starpad-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: INDIKAT Star Pad – Build ${{ github.run_number }}
          make_latest: false
          fail_on_unmatched_files: false
          body: |
            Automatischer Build von `${{ github.sha }}`.

            **Windows:** ZIP entpacken, `INDIKAT Star Pad.vst3` nach `C:\Program Files\Common Files\VST3\` kopieren. `INDIKAT Star Pad.exe` ist die Standalone-Version.
            **macOS:** ZIP entpacken, im Ordner Rechtsklick auf `INDIKAT installieren.command` → Öffnen. Das Skript kopiert VST3 und AU, hebt die Sperre auf und signiert lokal (fragt nach dem Mac-Passwort).
            **Linux:** `.vst3` nach `~/.vst3/`.
          files: dist/*.zip
